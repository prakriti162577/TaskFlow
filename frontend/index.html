<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow | Task Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        // Apply saved theme before first paint to avoid a flash
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("taskflow_theme"); } catch (e) {}
            if (!theme) {
                theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Nature background: shader gradient, pixel pine forest, fireflies -->
    <canvas id="shader" aria-hidden="true"></canvas>
    <div class="forest" aria-hidden="true"></div>
    <div aria-hidden="true">
        <span class="fly" style="left:8%;top:62%;animation-delay:0s"></span>
        <span class="fly" style="left:24%;top:78%;animation-delay:-3s"></span>
        <span class="fly" style="left:47%;top:70%;animation-delay:-6s"></span>
        <span class="fly" style="left:63%;top:84%;animation-delay:-1.5s"></span>
        <span class="fly" style="left:78%;top:66%;animation-delay:-4.5s"></span>
        <span class="fly" style="left:92%;top:80%;animation-delay:-7.5s"></span>
    </div>

    <!-- Walking pixel cat -->
    <div class="walker" aria-hidden="true">
        <div class="walker-cat"><div class="walker-sprite"></div></div>
    </div>

    <div class="app">
        <div class="backdrop" id="backdrop"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-mark">&#10003;</span>
                <span>TensorFlow</span>
            </div>

            <nav class="nav">
                <button class="nav-item" id="allLink" type="button">
                    <span class="nav-icon">&#9776;</span>
                    <span class="nav-label">All tasks</span>
                    <span class="count" id="allCount">0</span>
                </button>
                <button class="nav-item" id="completedLink" type="button">
                    <span class="nav-icon">&#10004;</span>
                    <span class="nav-label">Completed</span>
                    <span class="count" id="doneCount">0</span>
                </button>
            </nav>

            <div class="side-section">
                <div class="side-heading">
                    <span>Lists</span>
                    <button class="icon-btn" id="addListBtn" type="button" aria-label="New list" title="New list">+</button>
                </div>

                <form id="listForm" class="list-form" hidden>
                    <input id="listInput" type="text" placeholder="List name, then Enter" maxlength="40" autocomplete="off" aria-label="New list name">
                </form>

                <ul class="list-nav" id="listNav"></ul>
            </div>

            <div class="side-footer">
                <button class="theme-toggle" id="themeToggle" type="button">
                    <span id="themeIcon" aria-hidden="true">&#127769;</span>
                    <span id="themeLabel">Dark mode</span>
                </button>
                <p class="hint"><kbd>N</kbd> new task &middot; <kbd>/</kbd> search</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">

            <header class="topbar">
                <div class="topbar-left">
                    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu">&#9776;</button>
                    <div>
                        <h1 id="pageTitle">All Tasks</h1>
                        <p id="pageSubtitle" class="muted"></p>
                    </div>
                </div>

                <button id="addTaskBtn" class="primary-btn" type="button">+ New task</button>
            </header>

            <!-- Statistics -->
            <section class="stats" id="stats">
                <div class="stat-card">
                    <p>Total</p>
                    <h2 id="totalTasks">0</h2>
                </div>
                <div class="stat-card">
                    <p>Pending</p>
                    <h2 id="pendingTasks">0</h2>
                </div>
                <div class="stat-card">
                    <p>In progress</p>
                    <h2 id="progressTasks">0</h2>
                </div>
                <div class="stat-card">
                    <p>Completed</p>
                    <h2 id="completedTasks">0</h2>
                </div>
            </section>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
                <span class="muted" id="progressText"></span>
            </div>

            <!-- Quick add -->
            <form class="quick-add" id="quickForm" autocomplete="off">
                <input type="text" id="quickAdd" maxlength="150" placeholder="Add a task and press Enter" aria-label="Quick add task">
                <button type="button" class="secondary-btn" id="quickDetails" title="Add with more details">Details</button>
                <button type="submit" class="primary-btn">Add</button>
            </form>

            <!-- Tasks Section -->
            <section class="tasks-section">

                <div class="toolbar" id="toolbar">
                    <input type="search" id="searchInput" placeholder="Search tasks  ( / )" aria-label="Search tasks">

                    <select id="statusFilter" aria-label="Filter by status">
                        <option value="">All status</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>

                    <select id="priorityFilter" aria-label="Filter by priority">
                        <option value="">All priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>

                    <select id="sortFilter" aria-label="Sort tasks">
                        <option value="dueDate-asc">Due: earliest</option>
                        <option value="dueDate-desc">Due: latest</option>
                        <option value="title-asc">Title: A to Z</option>
                        <option value="priority-desc">Priority: high first</option>
                        <option value="priority-asc">Priority: low first</option>
                    </select>

                    <button id="clearFiltersBtn" class="secondary-btn" type="button">Reset</button>
                </div>

                <div id="taskContainer"></div>

                <p id="taskCount" class="task-count"></p>
            </section>
        </main>
    </div>

    <!-- Add/Edit Task Modal -->
    <div id="taskModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">New task</h2>
                <button type="button" id="closeModal" class="icon-btn" aria-label="Close">&times;</button>
            </div>

            <form id="taskForm">
                <label for="taskTitle">Title</label>
                <input type="text" id="taskTitle" placeholder="What needs to be done?" maxlength="150" required>

                <label for="taskDescription">Description <span class="optional">optional</span></label>
                <textarea id="taskDescription" placeholder="Add any details" rows="3"></textarea>

                <div class="row">
                    <div>
                        <label for="taskCategory">List</label>
                        <select id="taskCategory" required></select>
                    </div>
                    <div>
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority" required>
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="taskDueDate">Due date</label>
                        <input type="date" id="taskDueDate" required>
                    </div>
                    <div id="statusField">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus">
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <label for="taskTags">Tags <span class="optional">comma separated</span></label>
                <input type="text" id="taskTags" placeholder="e.g. urgent, assignment">

                <div class="form-actions">
                    <button type="button" id="cancelModal" class="secondary-btn">Cancel</button>
                    <button type="submit" id="saveTaskBtn" class="primary-btn">Save task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Task Details Modal (read-only) -->
    <div id="detailsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Task details</h2>
                <button type="button" id="closeDetails" class="icon-btn" aria-label="Close">&times;</button>
            </div>

            <div class="details" id="detailsBody"></div>

            <div class="form-actions">
                <button type="button" id="detailsDelete" class="secondary-btn">Delete</button>
                <button type="button" id="detailsEdit" class="primary-btn">Edit task</button>
            </div>
        </div>
    </div>

    <!-- Cat celebration (pixel cat is drawn by CSS) -->
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="celebration" id="celebration" aria-live="polite">
        <div class="celebration-card">
            <div class="celebration-cat" id="celebrationCat"></div>
            <h3 id="celebrationTitle">Purrfect!</h3>
            <p id="celebrationTask"></p>
        </div>
    </div>

    <!-- Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toastText"></span>
        <button type="button" id="toastAction" class="toast-action" hidden></button>
    </div>

    <script src="shader.js"></script>
    <script src="script.js"></script>

</body>
</html>
